name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        # No Supabase/Paystack env vars here on purpose: data-fetching code
        # treats an unconfigured Supabase client as "no data yet" and renders
        # empty states instead of failing, so the build succeeds without
        # secrets. Real credentials live in Vercel's project settings and are
        # only needed at request time, not at build time.
